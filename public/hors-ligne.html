<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>Movacash</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: Inter, system-ui, -apple-system, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; box-sizing: border-box; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  p { margin: 0; color: #a1a1aa; font-size: 15px; }
  button { margin-top: 6px; padding: 12px 22px; border: 0; border-radius: 999px; background: #fff; color: #000; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="" />
  <p id="m">Pas de connexion internet.</p>
  <button id="b" onclick="location.reload()">Réessayer</button>
</main>
<script>
  var l = (navigator.language || "fr").slice(0, 2);
  var t = { en: ["No internet connection.", "Try again"], de: ["Keine Internetverbindung.", "Erneut versuchen"], es: ["Sin conexión a internet.", "Reintentar"], it: ["Nessuna connessione internet.", "Riprova"], pt: ["Sem ligação à internet.", "Tentar novamente"], nl: ["Geen internetverbinding.", "Opnieuw proberen"], pl: ["Brak połączenia z internetem.", "Spróbuj ponownie"] }[l];
  if (t) { document.documentElement.lang = l; document.getElementById("m").textContent = t[0]; document.getElementById("b").textContent = t[1]; }
</script>
</body>
</html>
